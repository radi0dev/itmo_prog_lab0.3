name: tests

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rep
        uses: actions/checkout@v4

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: install requirements
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: run tests
        run: pytest tests/ -v
